name: tests

on: push

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make a python3 command on Windows (the fix the installer suggests)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir=$(dirname "$(command -v python)")
          [ -e "$dir/python3.exe" ] || cp "$dir/python.exe" "$dir/python3.exe"
      - run: python -m unittest discover -s tests/workflow -t tests/workflow
